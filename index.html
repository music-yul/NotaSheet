/* NotaSheet 오류 기록: 오류가 나면 화면 오른쪽 아래에 버튼이 나타나고, 누르면 보고 내용이 복사돼요 */
window.NOTA_VERSION='2026-10-31-r3';
(()=>{
 const errs=[],clicks=[];
 const top3=s=>String(s||'').split('\n').slice(0,3).join(' | ').slice(0,260);
 const add=(e,where)=>{errs.push({t:new Date().toLocaleTimeString('ko-KR'),where:where||'',msg:(e&&e.message)||String(e),st:top3(e&&e.stack)});if(errs.length>20)errs.shift();badge()};
 window.__notaErr=add;
 addEventListener('error',ev=>add(ev.error||ev.message,'window'));
 addEventListener('unhandledrejection',ev=>add(ev.reason,'promise'));
 document.addEventListener('click',e=>{const el=(e.target.closest&&e.target.closest('button,[id]'))||e.target;clicks.push((el.id?'#'+el.id:el.tagName.toLowerCase())+' "'+(el.textContent||'').trim().slice(0,14)+'"');if(clicks.length>8)clicks.shift()},true);
 function text(){return '[NotaSheet 오류 보고]\n버전: '+window.NOTA_VERSION+'\n브라우저: '+navigator.userAgent.replace(/Mozilla\/5.0 /,'').slice(0,90)+'\n최근 누른 것: '+clicks.join(' → ')+'\n오류 '+errs.length+'건:\n'+errs.map((x,i)=>(i+1)+') '+x.t+' ['+x.where+'] '+x.msg+'\n   '+x.st).join('\n')}
 function badge(){
  if(!document.body){document.addEventListener('DOMContentLoaded',badge,{once:true});return}
  let b=document.getElementById('notaErrBadge');
  if(!b){b=document.createElement('button');b.id='notaErrBadge';b.type='button';b.style.cssText='position:fixed;right:14px;bottom:14px;z-index:99999;background:#a64232;color:#fff;border:0;border-radius:18px;padding:8px 14px;font:12px Arial,sans-serif;box-shadow:0 4px 14px #0004;cursor:pointer';
   b.onclick=()=>{const s=text();const done=()=>{b.textContent='복사됨 · 클로드에게 붙여넣어 주세요';errs.length=0;setTimeout(()=>b.remove(),2500)};
    (navigator.clipboard?navigator.clipboard.writeText(s).then(done,()=>{prompt('아래 내용을 복사해 주세요',s);done()}):(prompt('아래 내용을 복사해 주세요',s),done()))};document.body.append(b)}
  b.textContent='⚠ 오류 '+errs.length+'건 · 눌러서 내용 복사';
 }
})();
</script>

/* ===== 묶음 1: 상단 툴바 정리 ===== */
.toolbar .page-setup{gap:8px}
.toolbar .page-orientation,.toolbar .page-margin{display:inline-flex;align-items:center;gap:4px;margin:0;font-size:12px;color:#59667b}
.toolbar .page-orientation select,.toolbar .page-margin select{width:auto;height:28px;padding:0 4px;font-size:12px}
.toolbar .view-toggle{display:inline-flex;gap:0;margin-left:auto}
.toolbar .view-toggle button{height:28px;padding:0 12px;font-size:12px;border-radius:0}
.toolbar .view-toggle button:first-child{border-radius:6px 0 0 6px}
.toolbar .view-toggle button:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
/* 맥락 툴바(표·글상자·이미지·악보 선택) 공통 크기 */
#documentDock :is(#tableTools,#objectTools,#scoreTools,#documentContextTools) :is(button,select,input:not([type=range]):not([type=color]):not([type=checkbox])){height:28px!important;min-height:0!important;padding:0 8px!important;font-size:12px!important;line-height:1!important;border-radius:6px!important;box-sizing:border-box}
#documentDock :is(#tableTools,#objectTools,#scoreTools,#documentContextTools) input[type=number]{width:64px!important}
#documentDock :is(#tableTools,#objectTools,#scoreTools,#documentContextTools) :is(label,span,small){font-size:12px;color:#4b5a70}
#documentDock :is(#tableTools,#objectTools,#scoreTools,#documentContextTools) label{display:inline-flex;align-items:center;gap:4px;margin:0;white-space:nowrap}
#documentDock :is(#tableTools,#objectTools) input[type=color]{width:28px;height:28px;padding:1px!important}
/* 표 툴바: 한 줄 */
#documentDock #tableTools{flex-wrap:nowrap!important;overflow-x:auto;white-space:nowrap;gap:5px!important}
#documentDock #tableTools .table-section{font-size:11px;font-weight:600;color:#7b8798;padding-left:8px;border-left:1px solid #d4dde8;margin-left:3px}
#documentDock #tableTools small{display:none}
#documentDock #tableTools [data-table]{min-width:34px;padding:0 7px!important}

/* ===== 묶음 1.1 ===== */
#editor p[style*="border-bottom"]{display:flow-root}
#documentDock #objectTools :is(#objectFlow,#objectDelete,small){display:none!important}
#documentDock #tableTools>span:not(.table-section):not(.tool-title){display:none}
#documentDock :is(#tableTools,#objectTools)>:is(.tool-title,#objectTitle){font-size:12px;font-weight:700;color:#354968;margin-right:4px}
#documentDock #tableTools [data-table],#documentDock #tableTools .cell-align button{display:inline-flex!important;align-items:center;justify-content:center;min-width:30px;padding:0 6px!important}
#documentDock #tableTools svg,.toolbar .align-group svg{width:16px;height:16px;display:block;pointer-events:none}
.toolbar .align-group{display:inline-flex;align-items:center}
.toolbar .align-group button{height:28px;padding:0 7px;display:inline-flex;align-items:center;border-radius:0;margin-left:-1px}
.toolbar .align-group button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.toolbar .align-group button:last-child{border-radius:0 6px 6px 0}
#documentDock #tableTools .cell-align{display:inline-flex}
#documentDock #tableTools .cell-align button{border-radius:0!important;margin-left:-1px}
#documentDock #tableTools .cell-align button:first-child{border-radius:6px 0 0 6px!important;margin-left:0}
#documentDock #tableTools .cell-align button:last-child{border-radius:0 6px 6px 0!important}

/* ===== 묶음 2: 키보드 안내 ===== */
#modal #scoreNoteInput>.keyboard-score-hint,#modal .keyboard-score-hint{display:block!important}
.keyboard-score-hint .kbd-grid{display:grid;gap:6px;margin-top:6px}
.keyboard-score-hint .kbd-row{display:grid;grid-template-columns:48px 1fr;align-items:center;gap:8px}
.keyboard-score-hint .kbd-row>b{font-size:11px;color:#354968;font-weight:700}
.keyboard-score-hint .kbd-row>span{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:11px;color:#4b5a70}
.keyboard-score-hint kbd{margin-right:3px}

/* ===== 추가 기능: 목록/줄간격 메뉴, 문서에 넣기 그룹, 대화상자 ===== */
.toolbar .mb{position:relative;display:inline-flex}
.toolbar .mb-btn{height:28px;padding:0 7px;display:inline-flex;align-items:center;gap:4px;font-size:12px}
.toolbar .mb-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.toolbar .mb-btn svg circle{fill:currentColor;stroke:none}
.mb-menu{position:absolute;top:100%;left:0;z-index:70;margin-top:3px;background:#fff;border:1px solid #d4dde8;border-radius:8px;box-shadow:0 6px 18px #23334a26;padding:4px;display:flex;flex-direction:column;min-width:108px}
.mb-menu[hidden]{display:none}
.mb-menu button{border:0;background:none;text-align:left;height:28px;padding:0 9px;font-size:12px;border-radius:5px;white-space:nowrap}
.mb-menu button:hover{background:#edf2f8}
.mb-menu i{display:inline-block;width:20px;font-style:normal;color:#354968}
.insert .ins-title{grid-column:1/-1;font-size:11px;font-weight:700;color:#7b8b80;margin:10px 0 2px;letter-spacing:.5px}
.insert .ins-title:first-child{margin-top:0}
.insert{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.nota-dlg{border:1px solid #d4dde8;border-radius:12px;padding:18px 20px;width:min(560px,92vw);box-shadow:0 10px 40px #23334a33}
.nota-dlg h4{margin:0 0 10px;font-size:15px}
.nota-dlg .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0;font-size:13px}
.nota-dlg .dlg-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.nota-dlg .shape-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nota-dlg .shape-grid label{border:1px solid #d4dde8;border-radius:8px;padding:6px;display:flex;justify-content:center;cursor:pointer}
.nota-dlg .shape-grid input{display:none}
.nota-dlg .shape-grid input:checked+svg{outline:2px solid #3a6fb0;outline-offset:3px;border-radius:3px}
.nota-dlg .shape-grid svg{width:64px;height:38px;fill:none;stroke:#354968;stroke-width:2;vector-effect:non-scaling-stroke}
.nota-dlg .crop-stage{display:flex;justify-content:center;background:#f1f4f8;border-radius:8px;padding:8px}
.nota-dlg canvas{max-width:100%;cursor:crosshair;touch-action:none}
.nota-dlg .hint{margin:0 0 8px;font-size:12px;color:#5b6a7e}

/* ===== 도형 다양화 · 선 그림 선택 · 표 디자인 ===== */
.nota-dlg{max-height:88vh;overflow:auto}
.nota-dlg .sec{font-size:12px;font-weight:700;color:#7b8b80;margin:12px 0 6px}
.nota-dlg .shape-grid{grid-template-columns:repeat(6,1fr)!important;gap:6px!important}
.nota-dlg .shape-grid label{padding:4px!important}
.nota-dlg .shape-grid svg{width:48px!important;height:34px!important}
.nota-dlg .pick-grid{display:grid;gap:8px;grid-template-columns:repeat(4,1fr)}
.nota-dlg .pick-grid.c2{grid-template-columns:repeat(2,1fr)}
.nota-dlg .pick{border:1px solid #d4dde8;border-radius:8px;padding:8px 6px;display:flex;justify-content:center;cursor:pointer}
.nota-dlg .pick input{display:none}
.nota-dlg .pick svg{width:100%;height:26px;overflow:visible}
.nota-dlg .pick:has(input:checked){outline:2px solid #3a6fb0;background:#f3f7fc}
.nota-dlg .swatches{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nota-dlg .swatches button{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px #c3ccd8}
.tbl-design{margin-top:14px}
.tdz-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tdz{border:1px solid #d4dde8;border-radius:8px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;cursor:pointer}
.tdz input{display:none}
.tdz svg{width:56px;height:40px;fill:none;stroke:#354968;stroke-width:1.5}
.tdz:has(input:checked){outline:2px solid #3a6fb0;background:#f3f7fc}
.tdz-head{display:block;margin-top:10px;font-size:13px}
#editor table[data-design=none] :is(td,th){outline:1px dashed #cfd6e2;outline-offset:-1px}
@media print{#editor table[data-design=none] :is(td,th){outline:none}}

/* ===== 표 삽입 창을 다른 도구 창과 같은 모양으로 ===== */
#modal:has(.tbl-design){width:min(460px,92vw);padding:18px 20px;border:1px solid #d4dde8;border-radius:12px;box-shadow:0 10px 40px #23334a33}
#modal:has(.tbl-design) #close{display:none}
#modal:has(.tbl-design) footer{margin-top:16px}
#modal .tbl-title{margin:0 0 12px;font-size:15px}
#modal .tbl-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 4px}
#modal .tbl-row label{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:13px}
#modal .tbl-row input{width:64px;padding:5px 8px}
#modal .tbl-hint{font-size:11px;color:#7b8798}
#modal .tbl-design .sec{font-size:12px;font-weight:700;color:#7b8b80;margin:12px 0 6px}
#modal .tbl-pv{padding:10px;background:#f1f4f8;border-radius:8px;max-height:150px;overflow:hidden}
#modal .tbl-pv table{width:100%;table-layout:fixed;border-collapse:collapse;background:#fff}
#modal .tbl-pv td{height:16px;padding:0}
#modal .tbl-pv table[data-design=none] td{outline:1px dashed #cfd6e2;outline-offset:-1px}
.tbl-design{margin-top:8px!important}

/* ===== 묶음 3: 악보 입력 사이드바 정리 + 음표 직접 선택 ===== */
.nota-fold{margin:10px 0;border:1px solid #d7e0ec;border-radius:8px;background:#fbfcfe}
.nota-fold>summary{cursor:pointer;padding:7px 10px;font-size:12px;font-weight:600;color:#354968;list-style:none;user-select:none}
.nota-fold>summary::-webkit-details-marker{display:none}
.nota-fold>summary::before{content:'▸ '}
.nota-fold[open]>summary::before{content:'▾ '}
.nota-fold>:not(summary){margin:0 10px 10px!important}
.nota-fold .cnt{color:#7b8798;font-weight:400}
.beamTools>h4,.notation-appearance>p{display:none}
.nota-seg{display:grid!important;grid-template-columns:repeat(3,1fr);gap:4px}
.nota-seg button{padding:6px 2px!important;font-size:12px!important;white-space:nowrap;min-width:0}
.nota-actions{display:grid!important;grid-template-columns:repeat(3,1fr);gap:6px}
.nota-actions button{padding:6px 4px!important;font-size:12px!important;white-space:nowrap;min-width:0;justify-content:center}
.nota-actions #clearnotes{grid-column:1/-1;color:#a64232;border-color:#e3c7c2;background:#fff}
#scorepreview [data-note-index]{cursor:pointer}
#scorepreview [data-note-index]:hover{opacity:.7}
#scorepreview .nota-sel{filter:drop-shadow(0 0 3px #3a6fb0) drop-shadow(0 0 1px #3a6fb0)}
</style>
